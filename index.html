<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La szarlotka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e23d3d; --red2:#b82828; --cream:#fff8ee; --ink:#4a2c1a; --ink2:#7a5a44;
  --wood:#c8874f; --wood2:#9c6334; --green:#2f9e55; --wall:#ffe1c7; --gold:#f4b400;
  --line:#3b2314; --tan:#e6c4a3;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background-color:#fdf4e7;
  /* mantel de cuadros de cocina */
  background-image:linear-gradient(90deg,rgba(226,61,61,.09) 50%,transparent 0),linear-gradient(rgba(226,61,61,.09) 50%,transparent 0);
  background-size:min(9vw,13vh) min(9vw,13vh);
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
button{font-family:inherit}
input{font-family:inherit}
.btn{
  border:0;border-radius:18px;padding:14px 26px;font-size:1.25rem;font-weight:700;cursor:pointer;
  background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red2);transition:transform .1s;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red2)}
.btn:disabled{opacity:.5}
.btn.green{background:var(--green);box-shadow:0 5px 0 #1f7a3e}
.btn.light{background:#fff;color:var(--ink)}
.btn.small{font-size:1rem;padding:9px 16px;border-radius:14px}

/* ---------- home / join ---------- */
.center{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px 16px}
.panel-card{
  background:var(--cream);border-radius:28px;padding:28px 24px;max-width:520px;width:100%;
  text-align:center;
}
.logo{font-size:64px;line-height:1}
.panel-card h1{margin:.2em 0 0;color:var(--red);font-size:2.2rem}
.panel-card p{color:var(--ink2);font-size:1.1rem}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.field{
  width:100%;font-size:1.4rem;padding:12px 16px;border-radius:16px;
  background:#fff;color:var(--ink);text-align:center;outline:none;user-select:text;-webkit-user-select:text;
}
.field:focus{border-color:var(--red)}
.field.code{text-transform:uppercase;letter-spacing:.2em;font-weight:700}

/* ---------- game ---------- */
.game{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px 6px}
.hud .num{background:#fff;border-radius:12px;padding:4px 12px;font-weight:700}
.mist{background:#fff;border-radius:12px;padding:4px 10px;font-weight:700;white-space:nowrap;color:var(--red)}
.mist.zero{visibility:hidden}
.ribbon{
  margin:4px 12px 0;background:#fff;border-radius:20px;padding:10px 16px 10px;
}
.ribbon .num{font-size:.85rem;color:var(--ink2);font-weight:600}
.ribbon .instr{margin:2px 0 4px;font-size:clamp(1.25rem,4.6vw,2rem);font-weight:700;line-height:1.15}
.ribbon .tip{margin:0;font-size:clamp(.95rem,3.2vw,1.2rem);color:var(--ink2)}
.scene{
  flex:1;position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  align-content:safe center;gap:16px;padding:14px 12px;overflow-x:hidden;overflow-y:auto;
}
.host{display:flex;align-items:flex-end;gap:10px;padding:8px 14px 10px;background:linear-gradient(var(--wood),var(--wood2))}
.face{
  flex:none;width:62px;height:62px;border-radius:50%;background:#ffe0e0;border:4px solid var(--red);
  display:grid;place-items:center;font-size:38px;box-shadow:0 3px 0 rgba(0,0,0,.2)
}
.bubble{
  background:#fff;border-radius:18px 18px 18px 4px;padding:8px 14px;font-weight:600;font-size:clamp(1rem,3.6vw,1.3rem);
  box-shadow:0 3px 0 rgba(0,0,0,.15);margin-bottom:8px;
}
.bubble.pop{animation:pop .3s}
.host .bubble{flex:1;min-width:0}
.bubble .instr{margin:0;font-weight:700;font-size:clamp(1.1rem,4.4vw,1.5rem);line-height:1.15}
.bubble .tip{margin:3px 0 0;font-size:clamp(.9rem,3.4vw,1.1rem);color:var(--ink2);line-height:1.2}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
.shelf{
  display:grid;grid-template-columns:repeat(4,auto);gap:10px;justify-content:center;
  background:rgba(255,255,255,.35);padding:10px;border-radius:20px;border-bottom:8px solid var(--wood);
}
.shelf.wide{grid-template-columns:repeat(5,auto)}
.item{
  width:clamp(64px,19vw,96px);aspect-ratio:1;background:#fff;border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;touch-action:none;
  position:relative;transition:opacity .25s,transform .25s;
}
.item .em{font-size:clamp(30px,9vw,46px);line-height:1}
.item.jar{background:linear-gradient(90deg,#eef5f8,#fff 40%,#e6eef2);border-radius:14px 14px 22px 22px;border:2px solid #d5e2e8}
.item.jar::before{content:"";position:absolute;top:-7px;left:18%;right:18%;height:10px;background:#b06a3a;border-radius:6px 6px 2px 2px}
.item .em.small{font-size:clamp(20px,6vw,30px)}
.item .lbl{
  font-size:clamp(11.5px,3.1vw,14px);font-weight:700;text-align:center;line-height:1.05;hyphens:auto;background:#fff3d6;
  padding:2px 5px;border-radius:6px;margin-top:3px;max-width:92%;
}
.item.got{opacity:.3;transform:scale(.85)}
.item.used{visibility:hidden;pointer-events:none}
.item.selected,.ball.selected,.sarten.selected,.board.selected{outline:4px dashed var(--gold);outline-offset:4px}
.card{
  background:#fffdf6;border-radius:16px;padding:8px 14px;font-size:clamp(.9rem,3vw,1.1rem);
  width:min(100%,560px);
}
.card b{color:var(--red)}
.card ul{columns:2;column-gap:20px;padding-left:18px;margin:4px 0}
.card li{margin:2px 0}
.card li.done{text-decoration:line-through;color:var(--green)}
.card li.done::marker{content:"✔ "}

.apple{font-size:clamp(46px,13vw,70px);cursor:pointer;line-height:1}
.peeled{
  width:clamp(44px,12vw,62px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fffbe0,#f1df9c);box-shadow:inset -5px -5px 0 #e2c877;
}
.board{
  width:min(84vw,340px);height:170px;background:linear-gradient(#e6ad73,#c98a52);border-radius:22px;
  box-shadow:0 7px 0 #9c6334;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  align-content:center;gap:8px;padding:14px 50px 14px 14px;position:relative;cursor:pointer;touch-action:none;
}
.board .peeled{width:48px}
.board::after{content:"";position:absolute;right:-18px;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:var(--wall);box-shadow:inset 0 0 0 7px #c98a52}
.knife{position:absolute;right:8px;top:12px;font-size:44px;transform-origin:80% 80%}
.knife.chop{animation:chop .2s}
.cube{width:15px;height:15px;background:#f6e7a6;border-radius:3px;box-shadow:inset -2px -2px 0 #dcc165}
.sarten{
  width:min(60vw,250px);aspect-ratio:1;border-radius:50%;position:relative;touch-action:none;
  background:radial-gradient(circle,#4c4c4c 0 58%,#2e2e2e 59% 68%,#1f1f1f 69%);
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;align-content:center;padding:21%;gap:3px;
  margin-right:60px;box-shadow:0 8px 0 rgba(0,0,0,.2);
}
.sarten::after{content:"";position:absolute;left:96%;top:46%;width:70px;height:16px;background:#1f1f1f;border-radius:0 10px 10px 0}
.sarten.sizzle .cube{animation:jig .3s infinite alternate}
.sarten .spice{position:absolute;font-size:30px;animation:fall .8s forwards}
.bowl{
  width:min(66vw,270px);height:min(40vw,160px);position:relative;touch-action:none;
  background:linear-gradient(#88d0e8,#4a9fc0);border-radius:0 0 50% 50%/0 0 100% 100%;border-top:12px solid #b9e8f6;
  display:flex;align-items:flex-start;justify-content:center;flex-wrap:wrap;gap:2px;padding:8px 20px;
  box-shadow:0 8px 0 rgba(0,0,0,.12);
}
.bowl .mini{font-size:26px;transition:opacity .3s}
.bowl .ball.inbowl{position:absolute;left:50%;top:6px;margin-left:-55px;transition:transform .2s}
.ball{
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c9,#efcd7d);box-shadow:inset -7px -7px 0 #d9b25d;
  cursor:grab;touch-action:none;flex:none;
}
.ball.big{width:110px;height:110px}
.ball.small{width:66px;height:66px}
.nevera{
  width:130px;height:220px;background:linear-gradient(90deg,#f6f9fb,#dde6ed);border-radius:18px;border:3px solid #c3cfd9;
  position:relative;display:flex;flex-direction:column;box-shadow:0 7px 0 rgba(0,0,0,.12);
}
.nevera .fr-top{height:34%;border-bottom:3px solid #c3cfd9;display:flex;align-items:center;justify-content:center;font-size:34px}
.nevera .fr-in{flex:1;display:flex;align-items:center;justify-content:center;background:rgba(170,215,240,.35);margin:10px;border-radius:10px}
.nevera::after{content:"";position:absolute;right:10px;top:12%;width:7px;height:16%;background:#9fb0bf;border-radius:4px}
.molde{
  width:min(66vw,250px);aspect-ratio:1;background:#8f99a2;border-radius:12px;position:relative;flex:none;
  box-shadow:0 7px 0 #646d75;touch-action:none;
}
.molde.mini{width:120px;box-shadow:none}
.molde .in{position:absolute;inset:9px;border-radius:6px;background:#bcc4ca;overflow:hidden}
.molde .lay{position:absolute;inset:0;opacity:0;transition:opacity .4s,filter .8s,background .8s}
.lay-base{background:#f2da9f}
.molde.baked1 .lay-base{background:#e3b567}
.lay-apples{background:radial-gradient(circle,#f6e59a 32%,transparent 35%) 0 0/16px 16px,radial-gradient(circle,#efd57c 30%,transparent 33%) 8px 8px/16px 16px,#e7cd77}
.lay-crumb{background:radial-gradient(circle,#f3d896 42%,transparent 45%) 0 0/13px 13px,radial-gradient(circle,#ecc97c 40%,transparent 44%) 6px 7px/13px 13px}
.molde.baked2 .lay-crumb{filter:brightness(.82) saturate(1.5)}
.lay-sugar{background:radial-gradient(circle,#fff 28%,transparent 32%) 0 0/9px 9px,radial-gradient(circle,#fff 22%,transparent 27%) 4px 5px/9px 9px}
.molde.base .lay-base,.molde.apples .lay-apples,.molde.crumb .lay-crumb,.molde.sugar .lay-sugar{opacity:1}
.cutline{position:absolute;background:#6b3f1c;opacity:.75}
.cutline.v{top:0;bottom:0;width:4px;margin-left:-2px}
.cutline.h{left:0;right:0;height:4px;margin-top:-2px}
.grater{
  width:96px;height:160px;border-radius:12px 12px 6px 6px;position:relative;touch-action:none;cursor:pointer;
  background:radial-gradient(circle,#5b6168 2.5px,transparent 3.5px) 0 0/14px 14px,linear-gradient(90deg,#c9cfd5,#eef1f3,#b3bac1);
  border:3px solid #9aa2aa;box-shadow:0 6px 0 rgba(0,0,0,.15);
}
.grater::before{content:"";position:absolute;top:-30px;left:50%;margin-left:-22px;width:44px;height:30px;border:7px solid #333;border-bottom:0;border-radius:22px 22px 0 0}
.oven{
  width:min(88vw,360px);background:linear-gradient(#f3eee8,#ddd5cc);border-radius:20px;padding:12px;border:3px solid #c7bcb0;
  box-shadow:0 8px 0 rgba(0,0,0,.15);
}
.oven .ov-panel{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
.oven .disp{background:#1e2a22;color:#7dffa6;font-weight:700;border-radius:10px;padding:6px 12px;font-size:1.3rem;min-width:110px;text-align:center}
.oven .win{height:170px;border-radius:14px;background:#251a14;display:flex;align-items:center;justify-content:center;border:6px solid #8b8076;transition:background .4s}
.oven.on .win{background:radial-gradient(#ffb15a,#a2370e 70%,#3d1407);box-shadow:inset 0 0 30px #ff7b00}
.ctrls{display:flex;flex-direction:column;gap:10px;width:min(88vw,360px)}
.bar{width:min(80vw,320px);height:18px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 3px 0 var(--tan)}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:6px;transition:width .1s}
.clock{font-size:1.4rem;font-weight:700;background:#fff;border-radius:14px;padding:4px 14px}
.tap{cursor:pointer}
.ghost{position:fixed;z-index:999;pointer-events:none;opacity:.9;transform:scale(1.08) rotate(-4deg);margin:0!important}
.dragging{opacity:.25}
.drop{transition:transform .15s,filter .15s}
.drop.hot{transform:scale(1.06);filter:drop-shadow(0 0 12px #ffd23f)}
.shake{animation:shake .4s}
.pop{animation:pop .35s}
.float{position:fixed;pointer-events:none;font-size:30px;z-index:998;animation:floatUp 1s forwards}
@keyframes shake{0%,100%{translate:0}20%{translate:-9px}40%{translate:9px}60%{translate:-6px}80%{translate:6px}}
@keyframes pop{0%{scale:.7}70%{scale:1.12}100%{scale:1}}
@keyframes chop{50%{transform:rotate(-35deg) translateY(12px)}}
@keyframes jig{to{translate:0 -3px}}
@keyframes fall{from{transform:translateY(-60px);opacity:1}to{transform:translateY(10px);opacity:0}}
@keyframes floatUp{to{transform:translateY(-70px);opacity:0}}
@keyframes conf{to{transform:translateY(110vh) rotate(540deg)}}
.confetti{position:fixed;top:-40px;width:12px;height:18px;border:2px solid var(--line);border-radius:3px;pointer-events:none;z-index:997;animation:conf linear forwards}

/* final */
.final{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin:auto}
/* el final no se corta arriba en móviles bajos: se centra con margin, no con la caja */
.stage.end{align-items:flex-start}
.final .molde{width:min(250px,34dvh)}
.final h2{font-size:clamp(2rem,8vw,3.2rem);margin:0;color:var(--red)}
.stars{display:flex;gap:8px}
.stars svg{width:clamp(40px,10vw,60px);height:clamp(40px,10vw,60px)}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stats div{background:#fff;border-radius:16px;padding:8px 16px;font-size:1.2rem;font-weight:600}
.stats b{display:block;font-size:1.8rem;color:var(--red)}

/* ---------- TV slides ---------- */
.slide{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vh 6vw 12vh;text-align:center;gap:2vh}
.slide h1{font-size:clamp(2.4rem,7vw,6.5rem);color:var(--red);margin:0;line-height:1.05}
.slide h2{font-size:clamp(2rem,5vw,4.2rem);color:var(--red);margin:0}
.slide .big{font-size:clamp(1.3rem,3vw,2.8rem);margin:0;line-height:1.35}
.slide .huge-emoji{font-size:clamp(5rem,16vw,13rem);line-height:1}
.slide .note{font-size:clamp(1rem,1.8vw,1.6rem);color:var(--ink2)}
/* design system de las diapositivas (DESIGN.md) */
:root{--ds-bw:clamp(3px,.45vh,5px);--ds-sh:0 clamp(5px,.9vh,9px) 0 var(--line);--ds-r:clamp(16px,2.6vh,30px);--ds-gap:clamp(10px,2.4vh,28px);
  --t-display:min(9vw,13vh);--t-title:min(5.6vw,8.5vh);--t-body:min(2.8vw,4.6vh);--t-cap:min(1.6vw,2.6vh)}
.slide.ds{padding:4vh 5vw 10vh;gap:var(--ds-gap)}
.join.slide.ds{gap:1.6vh}
.ds h1{font-size:var(--t-display)}
.ds h2{font-size:var(--t-title);line-height:1.05}
.ds-kicker{font-size:var(--t-cap);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--line);margin:0;padding:.4vh 1.4vw;background:var(--gold);border:var(--ds-bw) solid var(--line);border-radius:999px;rotate:-2deg}
.ds-card{background:#fff;border:var(--ds-bw) solid var(--line);border-radius:var(--ds-r);box-shadow:var(--ds-sh)}
.ds-split{display:grid;grid-template-columns:auto 1fr;gap:5vw;align-items:center;width:100%;max-width:1600px}
.ds-list{display:flex;flex-direction:column;gap:var(--ds-gap);text-align:left}
.ds-row{display:flex;align-items:center;gap:1.6vw;padding:1.4vh 1.6vw;font-size:var(--t-body);line-height:1.2;font-weight:500}
.ds-ico{flex:none;width:1.9em;height:1.9em;border-radius:calc(var(--ds-r)*.6);background:var(--wall);border:var(--ds-bw) solid var(--line);display:grid;place-items:center;font-size:.95em}
.ds-ico .pic{width:80%;height:80%}
.ds-sticker{position:relative;padding:2.4vh;rotate:-3deg;background:var(--cream)}
.ds-sticker .pic{width:min(30vw,48vh);height:min(30vw,48vh)}
.ds-tag{position:absolute;padding:.6vh 1.2vw;font-size:var(--t-cap);font-weight:700;background:var(--gold);border:var(--ds-bw) solid var(--line);border-radius:999px;box-shadow:var(--ds-sh);rotate:6deg;white-space:nowrap}
.ds-sticker .ds-tag{right:-1.5vw;bottom:2vh}
.ds-stamp{display:grid;place-items:center;width:min(15vw,24vh);aspect-ratio:1;border-radius:50%;background:var(--gold);border:var(--ds-bw) solid var(--line);box-shadow:var(--ds-sh);
  font-size:min(2.4vw,3.8vh);font-weight:700;line-height:1;color:var(--line);text-align:center;rotate:-10deg}
.ds-stamp b{display:block;font-size:2.2em}
.ds-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4vw;width:100%;max-width:1600px}
.ds-tile{display:flex;flex-direction:column;align-items:center;gap:1.6vh;padding:3vh 1.6vw 2.6vh;font-size:var(--t-body);line-height:1.2;font-weight:500}
.ds-tile .art2{position:relative;height:min(15vw,24vh);display:flex;align-items:center;justify-content:center;gap:.5vw;font-size:min(10vw,16vh)}
.ds-tile .art2 .pic{height:100%;width:auto;max-width:min(13vw,20vh)}
.ds-tile.no .art2::after{content:'';position:absolute;inset:8% 18%;background:linear-gradient(45deg,transparent 45%,var(--red) 45% 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,var(--red) 45% 55%,transparent 55%)}
.ds-tile.no{background:#fff1ee}
.ds-in>*{animation:ds-in .45s cubic-bezier(.3,1.4,.5,1) both}
.ds-in>*:nth-child(2){animation-delay:.06s}.ds-in>*:nth-child(3){animation-delay:.12s}.ds-in>*:nth-child(4){animation-delay:.18s}
@keyframes ds-in{from{opacity:0;transform:translateY(3vh) scale(.96)}}
@media (prefers-reduced-motion:reduce){.ds-in>*{animation:none}}
/* pantalla 1: todos se conectan */
.join-grid{display:grid;grid-template-columns:auto 1fr;gap:4vw;align-items:center;width:100%;max-width:1600px}
.join-qr{padding:2.2vh;display:flex;flex-direction:column;align-items:center;gap:1vh}
.join-qr .qr{width:min(30vw,46vh);height:min(30vw,46vh)}
.join h1{font-size:min(7vw,10.5vh)}
.join .ds-steps{gap:1.4vh}
.join .ds-steps li{font-size:min(2.5vw,4vh)}
.ds-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2vh;text-align:left}
.ds-steps li{display:flex;align-items:center;gap:1.2vw;font-size:var(--t-body);font-weight:500;line-height:1.2;flex-wrap:wrap}
.ds-steps .n{flex:none;display:grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--green);color:#fff;font-weight:700;border:var(--ds-bw) solid var(--line)}
.ds-url{display:block;padding:.4vh .6vw;font-size:min(2.4vw,3.9vh);font-weight:700;color:var(--ink);user-select:text;-webkit-user-select:text;word-break:break-all}
.ds-code b{color:var(--red);letter-spacing:.14em;font-size:1.25em}
.ds-panel{background:var(--cream);padding:3vh 2.4vw;text-align:left}
.joined{display:flex;flex-wrap:wrap;gap:1vh .8vw;min-height:5vh;align-items:center;font-size:var(--t-cap);margin-top:1vh}
.joined .chip2{padding:.5vh 1vw;background:#fff;border:var(--ds-bw) solid var(--line);border-radius:999px;font-weight:600;animation:ds-in .4s both}
.joined .cnt2{font-weight:700;color:var(--green)}
.paper{background:var(--cream);border-radius:30px;padding:3vh 4vw}
.lines{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:1.4vh;text-align:left}
.lines li{font-size:clamp(1.3rem,3vw,2.7rem)}
.hl{color:var(--red);font-weight:700}
.flag{display:inline-block;width:1.4em;height:.9em;vertical-align:-.05em;background:linear-gradient(#fff 50%,#dc143c 50%);border:2px solid var(--line);border-radius:4px}
.gram{display:grid;grid-template-columns:1fr 1fr;gap:3vw;width:100%;max-width:1400px}
.gram .paper{text-align:left}
.gram h3{margin:0 0 1vh;font-size:clamp(1.3rem,2.6vw,2.4rem)}
.gram p{margin:.8vh 0;font-size:clamp(1.15rem,2.4vw,2.2rem)}
.ing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2vh 2vw;width:100%;max-width:1500px}
.ing{background:#fff;border-radius:22px;padding:1.6vh 1.2vw;display:flex;align-items:center;gap:1vw;text-align:left}
.ing .e{font-size:clamp(2rem,4.4vw,4rem)}
.ing .t{font-size:clamp(1rem,2vw,1.9rem);line-height:1.15}
.ing .t b{display:block;color:var(--red)}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:4vw;width:100%;max-width:1600px;align-items:start}
.qrbox{background:#fff;border-radius:26px;padding:2.4vh;display:flex;flex-direction:column;align-items:center;gap:1vh}
.qr{width:min(30vw,42vh);height:min(30vw,42vh);display:flex;align-items:center;justify-content:center}
.ds-board{width:100%;max-width:1400px;background:var(--cream);padding:2.4vh 2vw;text-align:left}
.ds-board .board-head,.ds-board .cls-t{font-size:var(--t-body)}
.ds-board .conn{font-size:var(--t-cap)}
.ds-board .stu{font-size:min(2.2vw,3.6vh)}
.tvbtns{display:flex;gap:10px}
.dot{display:inline-block;flex:none;width:.75em;height:.75em;border-radius:50%;background:var(--gold);border:2px solid var(--line);margin-right:.4em;vertical-align:-.05em}
.dot.on,.dot.st-ok{background:var(--green)}
.dot.st-away{background:#c9bdb2}
.wheat{display:inline-flex;height:100%;aspect-ratio:.64}
.wheat svg{width:100%;height:100%;fill:#f0c35a;stroke:var(--line);stroke-width:3}
.wheat.st{height:1.4em;margin-bottom:.15em}
.join-qr .ds-url{border-top:var(--ds-bw) dashed var(--tan);margin-top:.6vh;padding-top:1.2vh;text-align:center}
.qr img,.qr canvas{width:100%!important;height:100%!important;image-rendering:pixelated}
.code-big{font-size:clamp(2rem,5vw,4.5rem);font-weight:700;letter-spacing:.15em;color:var(--red)}
.url-small{font-size:clamp(.8rem,1.2vw,1.1rem);color:var(--ink2);word-break:break-all;max-width:min(30vw,42vh);user-select:text}
.board-list{display:flex;flex-direction:column;gap:1.2vh;text-align:left;max-height:72vh;overflow:hidden}
.board-head{display:flex;justify-content:space-between;align-items:center;font-size:clamp(1.2rem,2.4vw,2.2rem);font-weight:700}
.stu{display:grid;grid-template-columns:3ch 1fr 2fr auto;gap:1vw;align-items:center;background:#fff;border-radius:16px;padding:1vh 1.2vw;font-size:clamp(1rem,1.9vw,1.8rem)}
.stu .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu .pb{height:1.6vh;min-height:10px;background:#f2e2d2;border-radius:10px;overflow:hidden}
.stu .pb i{display:block;height:100%;background:var(--gold);transition:width .6s}
.stu.fin .pb i{background:var(--green)}
.stu .s{font-weight:700;white-space:nowrap}
.empty{font-size:clamp(1.1rem,2.2vw,2rem);color:var(--ink2);padding:3vh 0}
.conn{font-size:.9rem;color:var(--ink2)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:2vw}
.pod{display:flex;flex-direction:column;align-items:center;gap:1vh;width:min(24vw,320px)}
.pod .who{font-size:clamp(1.3rem,2.8vw,2.6rem);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .pts{font-size:clamp(1rem,2vw,1.8rem);color:var(--ink2)}
.pod .blk{width:100%;border-radius:20px 20px 0 0;display:flex;align-items:flex-start;justify-content:center;font-size:clamp(3rem,6vw,5.5rem);padding-top:1vh;box-shadow:inset 0 -10px 0 rgba(0,0,0,.08)}
.pod.p1 .blk{height:30vh;background:#ffd34d}
.pod.p2 .blk{height:22vh;background:#dfe5ea}
.pod.p3 .blk{height:16vh;background:#f0b98a}
.rest{display:flex;flex-wrap:wrap;gap:1vw;justify-content:center;max-width:1400px}
.rest span{background:#fff;border-radius:14px;padding:.6vh 1.2vw;font-size:clamp(1rem,1.7vw,1.6rem)}
.steps-sum{columns:2;column-gap:4vw;text-align:left;margin:0;padding-left:2.4em;max-width:1600px}
.steps-sum li{font-size:clamp(1rem,2vw,1.9rem);margin:.7vh 0;break-inside:avoid}
.steps-sum li::marker{color:var(--red);font-weight:700}
.serve{margin:1.4vh 0 0;font-size:clamp(1rem,2vw,1.9rem);font-weight:700;color:var(--red);text-align:center}
.tvnav{position:fixed;right:2vw;bottom:2vh;display:flex;gap:10px;align-items:center;z-index:50}
.tvnav .cnt{background:#fff;border-radius:12px;padding:6px 12px;font-weight:600}
.tvbtns{display:flex;gap:1.5vw;flex-wrap:wrap;justify-content:center}
.back-tv{position:fixed;left:10px;top:10px;z-index:60}

/* ---------- la cocina ---------- */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 8px 0;position:relative;container-type:size}
.stage.end{align-items:center;justify-content:center;overflow-y:auto;padding:10px;container-type:normal}
/* la cocina es un cuadro 21:9 (como img/kuchnia.jpg); cada mueble va en su sitio del cuadro (LAYOUT) */
.kitchen2{--ar:2.3333;flex:none;position:relative;width:min(100cqw,100cqh*var(--ar));height:min(100cqh,100cqw/var(--ar))}
.kitchen2>.furn,.kitchen2>.counter{position:absolute}
/* un solo dibujo de toda la cocina: cada puerta es su trozo del dibujo, el blat no tiene fondo propio */
.kitchen2.one{background:center/100% 100% no-repeat}
.kitchen2.one>.furn{border:0;border-radius:2px;box-shadow:inset 0 0 0 3px rgba(59,35,20,.35)}
.kitchen2.one .door{inset:0;border:0;border-radius:0;box-shadow:none;background:none;perspective:900px}
/* las hojas giran sobre sus bisagras hacia fuera y se quedan abiertas, con la cara de atrás más oscura */
.leaf{position:absolute;top:0;bottom:0;transform-origin:left center;transition:transform .55s cubic-bezier(.3,.8,.35,1.1),opacity .4s}
.leaf>.lface{position:absolute;inset:0;background-repeat:no-repeat}
.leaf.r{transform-origin:right center}
.leaf::after{content:'';position:absolute;inset:0;background:#3b2314;opacity:0;transition:opacity .35s;pointer-events:none}
.kitchen2.one .furn.open:not(.f-cajon):not(.f-horno) .door{transform:none;opacity:1;pointer-events:none}
.furn.open .leaf.l{transform:rotateY(-100deg)}
.furn.open .leaf.r{transform:rotateY(100deg)}
.f-cajon.open .leaf,.f-horno.open .leaf{transform:none}
.kitchen2.one .f-horno.open .door{transform:none}
.kitchen2.one .f-horno .door.has-img{background:none}
.kitchen2.one .f-horno{background:linear-gradient(transparent 55%,#8b8076 55% 57%,transparent 57% 80%,#8b8076 80% 82%,transparent 82%),radial-gradient(ellipse at 50% 75%,#5a2a12,#1e130d 70%)}
.kitchen2.one .f-horno.baking{background:linear-gradient(transparent 55%,#8b8076 55% 57%,transparent 57% 80%,#8b8076 80% 82%,transparent 82%),radial-gradient(ellipse at 50% 75%,#ffb15a,#a2370e 60%,#3d1407)}
.f-horno .oven-leaf{transform-origin:center bottom}
.f-horno.open .oven-leaf{transform:rotateX(-58deg)}
.f-horno .leaf:not(.oven-leaf)::after{display:none}
.furn.open .leaf::after{opacity:.45}
.kitchen2.one .f-armario1.open .leaf.l,.kitchen2.one .f-armario2.open .leaf.l,.kitchen2.one .f-armario3.open .leaf.l{transform:rotateY(-112deg)}
.kitchen2.one .f-armario1.open .leaf.r,.kitchen2.one .f-armario2.open .leaf.r,.kitchen2.one .f-armario3.open .leaf.r{transform:rotateY(112deg)}
/* la cara de dentro de la puerta: madera clara con su marco, no una mancha oscura */
.kitchen2.one .f-armario1 .leaf::after,.kitchen2.one .f-armario2 .leaf::after,.kitchen2.one .f-armario3 .leaf::after{
  background:linear-gradient(90deg,#c48347,#e2a86b 45%,#cf9055);box-shadow:inset 0 0 0 3px var(--line),inset 0 0 0 9px #b5743c;transition:opacity 0s .2s}
.kitchen2.one .f-armario1.open .leaf::after,.kitchen2.one .f-armario2.open .leaf::after,.kitchen2.one .f-armario3.open .leaf::after{opacity:1}
/* por dentro: fondo de madera oscura con sombra arriba, baldas claras */
.kitchen2.one .f-armario1,.kitchen2.one .f-armario2,.kitchen2.one .f-armario3{
  background:linear-gradient(#6e4220,#9a5f31 18%,#ad6d3a);box-shadow:inset 0 0 0 3px var(--line),inset 0 12px 14px -6px rgba(0,0,0,.45)}
.kitchen2.one .f-armario1 .cell,.kitchen2.one .f-armario2 .cell,.kitchen2.one .f-armario3 .cell{border-bottom:6px solid #e0a86a;box-shadow:0 3px 0 var(--line)}
/* la puerta de la nevera por dentro: blanca, con dos baldas */
.f-nevera .leaf::after{background:linear-gradient(transparent 31%,#c9d6de 31% 33%,transparent 33% 64%,#c9d6de 64% 66%,transparent 66%),linear-gradient(90deg,#fbfdfe,#dde6ec);transition:opacity .1s .2s}
.f-nevera.open .leaf::after{opacity:1}
/* vitrina: por el cristal se ve lo que hay dentro */
.leaf.glass>.lface{-webkit-mask:linear-gradient(#000 0 0) center/67% 66% no-repeat,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) center/67% 66% no-repeat,linear-gradient(#000 0 0);mask-composite:exclude}
.leaf.glass::before{content:'';position:absolute;inset:17% 16.5%;background:linear-gradient(125deg,rgba(214,238,248,.55),rgba(255,255,255,.25) 35%,rgba(214,238,248,.15) 36%,rgba(214,238,248,.45))}
.kitchen2.one .f-armario2:not(.open) .inside{visibility:visible;pointer-events:none}
.kitchen2.one>.counter{background:none;box-shadow:none}
.kitchen2.one .ov-glass{left:13%;right:13%;top:40%;bottom:12%}
.furn{position:relative;perspective:650px;border:3px solid var(--line);border-radius:12px;background:#f1dcc3;box-shadow:inset 0 0 0 4px rgba(59,35,20,.12);z-index:1}
.furn.open{z-index:3}
.f-nevera{background:#e4f1f8}
.inside{position:absolute;inset:5px;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;align-content:stretch;gap:0}
.f-armario1 .inside{grid-template-columns:repeat(3,1fr)}
.f-cajon .inside{grid-template-columns:1fr}
.f-cajon{overflow:hidden}
.kitchen2.one .f-cajon{overflow:visible;background:linear-gradient(#4f301a,#7d4f2a 40%,#93603a);box-shadow:inset 0 0 0 3px var(--line),inset 10px 0 8px -6px rgba(0,0,0,.4),inset -10px 0 8px -6px rgba(0,0,0,.4)}
.kitchen2.one .f-cajon .inside{bottom:38%}
.kitchen2.one .f-cajon.open .door{transform-origin:center top;transform:translateY(64%) scale(1.06);z-index:4;filter:drop-shadow(0 6px 4px rgba(59,35,20,.4))}
.kitchen2.one .f-cajon .door{transition:transform .45s cubic-bezier(.3,.8,.35,1.1)}
.kitchen2.one .f-cajon .leaf{transform:none!important}
.kitchen2.one .f-cajon .leaf::after{display:none}
.f-cajon .inside{bottom:22%}
/* baldas: cada hueco tiene su estante */
.cell{display:grid;min-height:0;border-bottom:5px solid #c98a52;box-shadow:0 2px 0 rgba(59,35,20,.45)}
.f-nevera .cell{border-bottom-color:#fff;box-shadow:0 2px 0 #9fc3d8}
.f-cajon .cell{border:0;box-shadow:none}
.slot{width:100%;height:100%;min-height:36px;border:0;padding:2px;border-radius:8px;background:transparent;cursor:pointer;display:grid;place-items:center}
.slot>.th{max-width:44px;max-height:44px}
.f-nevera .slot>.th{max-width:58px;max-height:58px;font-size:clamp(26px,9vw,40px)}
.slot:active{background:rgba(255,255,255,.7)}
.slot.out{visibility:hidden}
.ball>.front{display:none}
.kitchen2:not(.zoom) .ball.has-front{background:none;border:0;box-shadow:none;filter:drop-shadow(0 3px 1.5px rgba(59,35,20,.35))}
.kitchen2:not(.zoom) .ball.has-front>:not(.front){display:none}
.kitchen2:not(.zoom) .ball.has-front>.front{display:block;width:100%;height:100%;object-fit:contain;object-position:bottom}
.slot>.front{max-width:92%;max-height:86%;width:auto;height:auto;align-self:end;filter:drop-shadow(0 2px 1px rgba(59,35,20,.35))}
.th{font-size:clamp(20px,6vw,28px);line-height:1}
img.th{width:100%;height:100%;object-fit:contain}
.th-ball{width:70%!important;height:auto!important;aspect-ratio:1}
.door{position:absolute;inset:-3px;z-index:2;cursor:pointer;border:3px solid var(--line);border-radius:12px;
  background:linear-gradient(#e6ad73,#c98a52);transform-origin:left center;transition:transform .5s cubic-bezier(.3,.8,.35,1.15);box-shadow:0 4px 0 var(--line)}
.door>i{position:absolute;right:10px;top:50%;translate:0 -50%;width:8px;height:32%;background:#7a4a20;border:2px solid var(--line);border-radius:5px}
.door.has-img{background-color:var(--line);background-repeat:repeat;border:0;box-shadow:none}
.f-horno .door.has-img{background-color:#efebe6}
.door.has-img.fit-contain{background-color:transparent}
/* lo de dentro solo se ve con la puerta abierta */
.furn:not(.open) .inside{visibility:hidden}
.furn:has(> .door.fit-contain):not(.open){background:transparent;box-shadow:none;border-color:transparent}
.f-horno .door.has-img .ov-glass{background:transparent;border-color:transparent}
.f-horno.baking .door.has-img .ov-glass{background:radial-gradient(#ffb15a,#a2370e 70%,#3d1407);border-color:var(--line)}
.f-nevera .door{background:linear-gradient(90deg,#f8fbfd,#d9e4ec)}
.f-nevera .door>i{background:#9fb0bf;height:40%}
.furn.open .door{transform:rotateY(-108deg)}
/* la puerta abierta se aparta y desaparece: no tapa nada */
.furn.open:not(.f-cajon):not(.f-horno) .door{opacity:0;pointer-events:none;transition:transform .45s ease-in,opacity .2s .25s}
.f-cajon .door{transform-origin:center bottom}
.f-cajon .door>i{right:auto;left:50%;top:12%;translate:-50% 0;width:34%;height:8px}
.f-cajon.open .door{transform:translateY(80%)}
.f-horno{background:#2a1d16}
.f-horno .door{transform-origin:center bottom;background:linear-gradient(#f0ebe5,#d8cfc6)}
.f-horno.open .door{transform:rotateX(-70deg)}
.knobs{display:flex;gap:6px;justify-content:center;padding:5px}
.knobs i{width:11px;height:11px;border-radius:50%;background:#555;border:2px solid var(--line)}
.ov-glass{position:absolute;left:12%;right:12%;top:32%;bottom:12%;background:#2a1d16;border:3px solid var(--line);border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.1rem;transition:background .4s}
.f-horno.baking .ov-glass{background:radial-gradient(#ffb15a,#a2370e 70%,#3d1407);box-shadow:0 0 18px #ff7b00}
.furn.drop{animation:nudge .6s ease-in-out infinite alternate}
.counter{position:relative;display:flex;flex-direction:column;border:3px solid var(--line);border-radius:12px;overflow:hidden;
  /* la superficie: dibujo de piedra (img/piedra.png) o, si no hay, puntitos con CSS */
  --surf:radial-gradient(rgba(90,70,50,.10) 1.2px,transparent 1.8px) 0 0/13px 13px,
    radial-gradient(rgba(255,255,255,.7) 1.2px,transparent 1.8px) 6px 7px/17px 17px,
    linear-gradient(160deg,#f3ece2,#e3d8c9);
  background:linear-gradient(to top,var(--wood2) 0 5px,var(--wood) 5px 18px,transparent 18px),var(--surf)}
/* en primer plano: azulejos detrás y la encimera de piedra delante */
.zoom .counter{background:linear-gradient(to top,var(--wood2) 0 6px,var(--wood) 6px 22px,transparent 22px),var(--surf);border-radius:6px 6px 0 0}
/* el blat forma parte de la cocina: sin marco */
.counter{border:0!important;box-shadow:0 3px 0 rgba(59,35,20,.35)}
/* lo sacado se pone de verdad sobre la encimera: sin tarjeta blanca, con su sombra */
.taken .tile-pic{background:none;border:0;box-shadow:none;padding:0;filter:drop-shadow(0 4px 2px rgba(59,35,20,.35))}
/* en primer plano la encimera se ve desde arriba: las cosas también, más grandes y con su sombra en la piedra */
.taken .tile-pic .top,.taken .tile-pic .front{display:none}
/* en la cocina: de frente, de pie en la encimera, apoyadas abajo y con sombra en la piedra */
.kitchen2:not(.zoom) .taken .tile:has(.has-front){width:auto}
.kitchen2:not(.zoom) .taken .tile-pic.has-front{width:auto;height:min(17cqh,90px);display:flex;align-items:flex-end;filter:drop-shadow(0 3px 1.5px rgba(59,35,20,.35))}
.kitchen2:not(.zoom) .taken .tile-pic.has-front>:not(.front){display:none}
.kitchen2:not(.zoom) .taken .tile-pic.has-front>.front{display:block;height:calc(100% * var(--s,1));width:auto}
.zoom .taken .tile{width:min(19dvh,104px)}
.zoom .taken .tile-pic{width:min(17dvh,92px);height:min(17dvh,92px);filter:drop-shadow(3px 6px 4px rgba(59,35,20,.28))}
.zoom .taken .tile-pic.has-top>:not(.top){display:none}
.zoom .taken .tile-pic.has-top>.top{display:block;width:100%;height:100%;object-fit:contain}
/* sin dibujo desde arriba: mejor el de frente (mismo estilo) que el icono viejo */
.zoom .taken .tile-pic.has-front:not(.has-top)>:not(.front){display:none}
.zoom .taken .tile-pic.has-front:not(.has-top)>.front{display:block;width:100%;height:100%;object-fit:contain;object-position:bottom}
/* sin rótulo: solo el objeto sobre la encimera */
.taken .tile-lbl{display:none}
/* las cosas están delante, sobre el borde de la encimera */
.counter .taken{order:2;align-items:flex-end;padding:0 6px 20px}
.counter .taken:empty{display:none}
.counter .work{padding-bottom:4px}
.kitchen2.zoom .work{padding-bottom:4px}
.taken{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:4px 4px 0}
.work{flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;gap:8px;padding:2px 6px 20px}
.counter.locked .work{visibility:hidden;pointer-events:none}
.counter.locked .work.show{visibility:visible}
.tile{width:56px;display:flex;flex-direction:column;align-items:center;cursor:grab;touch-action:none}
.tile-pic{width:42px;height:42px;padding:3px;background:#fff;border:3px solid var(--line);border-radius:12px;box-shadow:0 3px 0 var(--line);display:grid;place-items:center}
.tile-pic .th{font-size:24px}
.tile-lbl{font-size:10px;font-weight:700;line-height:1.05;text-align:center;margin-top:2px;background:rgba(255,255,255,.85);border-radius:4px;padding:0 2px}
.flyer{position:fixed;z-index:999;pointer-events:none;display:grid;place-items:center}
.counter .board{width:min(58vw,230px);height:auto;min-height:92px;padding:8px 42px 8px 8px;gap:4px;box-shadow:0 4px 0 var(--line)}
.counter .board::after{display:none}
.counter .apple{font-size:32px;cursor:pointer;width:42px;height:42px;display:grid;place-items:center}
.counter .peeled,.counter .board .peeled{width:30px}
.counter .knife{font-size:32px;top:6px}
.counter .cube{width:10px;height:10px}
.counter .sarten{width:min(30vw,120px);height:min(30vw,120px);min-height:0;margin-right:46px;padding:24px;overflow:hidden;box-shadow:0 4px 0 var(--line)}
.counter .sarten .spoon{position:absolute;right:8%;top:6%;font-size:30px;pointer-events:none;transform:rotate(25deg)}
.counter .sarten .spoon .th{width:34px;height:34px}
.counter .sarten::after{width:48px;height:12px}
.counter .bowl{width:min(44vw,170px);height:min(24vw,92px);box-shadow:0 0 0 3px var(--line),0 4px 0 var(--line)}
.counter .bowl .ball.inbowl{width:64px;height:64px;margin-left:-32px}
.counter .bowl .mini{font-size:20px}
.counter .bowl .mini .th{width:26px;height:26px;font-size:20px}
.counter .ball.big{width:74px;height:74px}
.counter .ball.small{width:44px;height:44px}
.counter .molde{width:min(30vw,118px);box-shadow:0 4px 0 var(--line)}
.counter .grater{width:54px;height:88px}
.counter .sieve{gap:2px}
.counter .sieve .th{width:36px;height:36px;font-size:28px}
.counter .clock{font-size:1rem;padding:2px 10px}
.counter .spice .th{width:30px;height:30px;font-size:24px}
.counter .btn{padding:8px 16px;font-size:1rem}
.oven-modal{position:absolute;inset:0;z-index:10;background:rgba(59,35,20,.35);display:flex;align-items:center;justify-content:center;padding:8px;border-radius:12px}
.oven-modal .box{width:100%;max-width:360px;background:var(--cream);border:3px solid var(--line);border-radius:18px;box-shadow:0 6px 0 var(--line);padding:10px;display:flex;flex-direction:column;gap:7px}
.oven-modal .ov-panel{display:flex;gap:8px;justify-content:center}

.zoom .counter .work.pair .molde{width:min(56vw,210px)}

.apple img.th{width:100%;height:100%}
.apple .th,.knife .th{font-size:inherit}
@keyframes zoomin{from{transform:scale(.55);opacity:.4}}
/* ---------- esperar a la clase ---------- */
.waitbox{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;
  background:rgba(255,248,236,.94);border:3px solid var(--line);border-radius:14px}
.waitbox .big{font-size:3.4rem;line-height:1}
.waitbox h2{margin:0;color:var(--green)}
.waitbox p{margin:0;font-size:1.15rem;font-weight:600}
.waitbox .spin{display:inline-block;animation:spin 1.6s linear infinite}
.hglass{width:min(22cqh,120px);aspect-ratio:2/3}
/* 6 s: cae la arena, se da la vuelta, cae otra vez, vuelve a girar */
.hglass svg{width:100%;height:100%;overflow:visible;animation:hg-flip 6s ease-in-out infinite}
.hglass .sand-a{transform-origin:40px 56px;animation:hg-a 6s linear infinite}
.hglass .sand-b{transform-origin:40px 96px;animation:hg-b 6s linear infinite}
.hglass .stream-a{animation:hg-sa 6s linear infinite,hg-flow .4s linear infinite}
.hglass .stream-b{animation:hg-sb 6s linear infinite,hg-flow .4s linear infinite}
@keyframes hg-flip{0%,42%{transform:rotate(0)}50%,92%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
@keyframes hg-a{0%{transform:scale(1)}40%,52%{transform:scale(.05)}92%,100%{transform:scale(1)}}
@keyframes hg-b{0%{transform:scale(.05)}40%,52%{transform:scale(1)}92%,100%{transform:scale(.05)}}
@keyframes hg-sa{0%,40%{opacity:1}41%,100%{opacity:0}}
@keyframes hg-sb{0%,51%{opacity:0}52%,92%{opacity:1}93%,100%{opacity:0}}
@keyframes hg-flow{to{stroke-dashoffset:-8}}
.waitbox .wait-t{font-size:clamp(1.3rem,6cqh,2rem);font-weight:700;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.hglass svg,.hglass path,.hglass line{animation:none}}
.okmark{width:56px;height:56px;border-radius:50%;background:var(--green);border:4px solid var(--line);box-shadow:0 4px 0 var(--line);position:relative}
.okmark::after{content:'';position:absolute;left:16px;top:9px;width:13px;height:24px;border:solid #fff;border-width:0 6px 6px 0;rotate:45deg}
.holdbox .who{font-size:1.6rem;font-weight:700;color:var(--red)}
.holdbox .ios{font-size:.95rem;font-weight:500;max-width:30em;color:var(--ink2)}
.fs-btn{position:fixed;left:10px;top:6px;z-index:70;padding:2px 10px!important}
.mute-btn{position:fixed;left:62px;top:6px;z-index:70;padding:2px 10px!important}
.mute-btn img{display:block;height:22px;width:auto}
.full .mute-btn{left:10px}
.full .fs-btn,.full .holdbox .fs{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- tele: paso de la clase ---------- */
.cls{display:flex;flex-direction:column;gap:1vh;background:#fff;border:3px solid var(--line);border-radius:16px;padding:1.2vh 1.2vw;margin:1vh 0;text-align:left}
.cls-t{font-size:clamp(1.1rem,2.1vw,2rem);line-height:1.2}
.cls-r{display:flex;justify-content:space-between;align-items:center;gap:1vw;font-size:clamp(1rem,1.8vw,1.7rem);font-weight:700}
/* ---------- servir ---------- */
.plate{width:min(40vw,160px);aspect-ratio:1;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle,#fff 55%,#e9eef2 56% 64%,#fff 65%);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.plate .cake{width:66%}
.plate span.cake{font-size:64px;width:auto}
.final .plate{width:min(62vw,240px)}
.deco-on{position:absolute;width:24%;height:24%;translate:-50% -50%;display:grid;place-items:center;font-size:28px;pointer-events:none}
.deco-on .th{width:100%;height:100%}

/* ---------- horno: botones ---------- */
.ctrl{display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:14px;padding:8px 12px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{
  font-family:inherit;font-size:1.25rem;font-weight:700;padding:10px 0;border-radius:12px;cursor:pointer;
  border:3px solid var(--line);background:#fff7e6;color:var(--ink);box-shadow:0 3px 0 var(--line);
}
.chip.on{background:var(--gold);transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.chip:disabled{opacity:.6}

/* ---------- estilo dibujo animado: contornos gruesos ---------- */
.btn,.btn.green,.btn.light{border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn:active{box-shadow:0 2px 0 var(--line)}
.panel-card,.ribbon,.card,.paper,.bubble,.item,.qrbox,.ing,.stu,.clock,.mist,.ctrl,.stats div,.rest span,.tvnav .cnt,.field{
  border:3px solid var(--line);box-shadow:0 5px 0 var(--line);
}
.ribbon{border-top:10px solid var(--red)}
.card{border-style:dashed}
.item.jar{border:3px solid var(--line)}
.item.jar::before{border:3px solid var(--line);top:-10px;height:13px}
.item:nth-child(3n){rotate:-3deg}
.item:nth-child(3n+1){rotate:2deg}
.board,.sarten,.bowl,.nevera,.molde,.grater,.oven,.peeled,.face,.bar,.oven .disp{border:3px solid var(--line)}
.board{box-shadow:0 7px 0 var(--line)}
.board::after{box-shadow:inset 0 0 0 7px #c98a52,0 0 0 3px var(--line)}
.sarten{box-shadow:0 7px 0 var(--line)}
.sarten::after{border:3px solid var(--line);border-left:0}
.bowl{border-top:12px solid #b9e8f6;box-shadow:0 0 0 3px var(--line),0 8px 0 var(--line);border-left:0;border-right:0;border-bottom:0}
.nevera,.molde,.oven,.grater{box-shadow:0 7px 0 var(--line)}
.nevera .fr-top{border-bottom:3px solid var(--line)}
.oven .win{border-color:var(--line)}
.ball{border:3px solid var(--line);box-shadow:inset -7px -7px 0 #d9b25d,0 4px 0 var(--line)}
.cube{border:2px solid var(--line)}
.host{border-top:4px solid var(--line)}
.slide h1,.slide h2,.panel-card h1,.final h2{text-shadow:3px 3px 0 #fff,6px 6px 0 var(--line)}
.lines li,.steps-sum li{text-shadow:none}
.pod .blk{border:3px solid var(--line);border-bottom:0}
/* imágenes de img/ */
.pic{display:block;object-fit:contain;pointer-events:none}
.em-img{width:80%;height:80%}
.em-img.small{width:55%;height:55%}
.pic.hero{height:clamp(150px,32vh,340px)}

.ing .pic.e{width:clamp(48px,5vw,84px);height:clamp(48px,5vw,84px)}
.hero:not(img){font-size:clamp(5rem,16vw,13rem);line-height:1}
.spice .pic{width:44px;height:44px}
.bowl .mini .pic{width:34px;height:34px}
.item.has-img .em-img{width:88%;height:88%}
.item.jar .em-img.small{width:62%;height:62%}

.loading{text-align:center;font-size:1.4rem;font-weight:600;color:var(--ink2)}
.loading .spin{font-size:72px;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-14px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}

@media (max-width:700px){

/* ---------- pilot: el móvil de quien presenta ---------- */
.pilot{min-height:100dvh;display:flex;flex-direction:column;gap:10px;padding:12px;max-width:560px;margin:0 auto}
.p-top{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px 10px}

.p-num{font-weight:700}

.p-es{margin:0;font-size:clamp(1.25rem,5.4vw,1.6rem);font-weight:600;line-height:1.3}
.p-pl{margin:10px 0 0;font-size:1rem;color:var(--ink2);line-height:1.3}

.p-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p-nav .btn{font-size:2rem;padding:16px 0}
/* ---------- minijuegos: gestos como en los juegos de cocina ---------- */
.mg{position:relative;touch-action:none}
.guides{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:5}
.guide{fill:none;stroke:#fff;stroke-width:4;stroke-dasharray:10 8;stroke-linecap:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 1.5px #3b2314);animation:dash .8s linear infinite}
.guide.done{stroke:#7a4a20;stroke-dasharray:none;stroke-width:3;animation:none;filter:none}
@keyframes dash{to{stroke-dashoffset:-18}}
.hand{position:absolute;z-index:7;pointer-events:none;font-size:38px;line-height:1;left:var(--x1);top:var(--y1);animation:handline 1.6s ease-in-out infinite}
@keyframes handline{0%{left:var(--x1);top:var(--y1);opacity:0}15%{opacity:1}80%{left:var(--x2);top:var(--y2);opacity:1}100%{left:var(--x2);top:var(--y2);opacity:0}}
.ring{position:absolute;inset:-6%;border:4px dashed #fff;border-radius:50%;pointer-events:none;z-index:4;filter:drop-shadow(0 0 1.5px #3b2314);animation:spin 8s linear infinite}
.orbit{position:absolute;inset:0;pointer-events:none;z-index:7;animation:spin 2.2s linear infinite}
.orbit span{position:absolute;left:50%;top:-4%;font-size:36px;translate:-50% -50%}
.swing{position:absolute;left:50%;top:50%;translate:-50% -50%;font-size:44px;pointer-events:none;z-index:7;filter:drop-shadow(0 0 2px #fff)}
.swing.x{animation:swx .7s ease-in-out infinite alternate}
.swing.y{animation:swy .7s ease-in-out infinite alternate}
@keyframes swx{from{margin-left:-50px}to{margin-left:50px}}
@keyframes swy{from{margin-top:-40px}to{margin-top:40px}}
.mg.started .hand,.mg.started .orbit,.mg.started .swing{display:none}
.tap{display:block;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);border:4px solid var(--line);box-shadow:0 0 0 6px rgba(244,180,0,.55);translate:-50% -50%;animation:tap 1.1s ease-in-out infinite}
.orbit .tap{translate:none}
@keyframes tap{50%{box-shadow:0 0 0 11px rgba(244,180,0,.2)}}
.tool-follow{position:absolute;z-index:6;pointer-events:none;width:64px;height:64px;translate:-25% -75%;display:grid;place-items:center;font-size:46px;line-height:1}
.tool-follow[hidden]{display:none}
.tool-follow img,.tool-follow .th{width:100%;height:100%;object-fit:contain;font-size:46px}
.tool-follow.chop{animation:chop .2s}
.tool-follow .ball{translate:0 30%}
.big-apple{position:relative;width:min(44vw,170px);aspect-ratio:1;flex:none}
.big-apple>img,.big-apple>.th,.big-apple>.peeled{position:absolute;inset:0;margin:auto}
.big-apple>img{width:100%;height:100%;object-fit:contain}
.big-apple>.th{display:grid;place-items:center;font-size:min(36vw,140px);line-height:1}
.big-apple>.peeled{width:76%!important;height:76%}
.big-apple .skin{-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.zoom .counter .board.tall{min-height:min(60vw,230px);padding:12px;justify-content:center}
.board.img{background:center/100% 100% no-repeat;border:0;box-shadow:none}
.board.img::after{display:none}
.trozos{display:grid;place-items:center}
.trozos>img{width:min(40vw,150px)}
.trozos .cubes{display:flex;flex-wrap:wrap;gap:3px;width:110px;justify-content:center}
.count{background:#fff;border:3px solid var(--line);border-radius:12px;padding:2px 14px;font-weight:700}
.dough-wrap{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;min-width:150px;min-height:130px}
.grater-wrap{position:relative;display:grid;place-items:center;padding:20px 10px;touch-action:none}

.bowl.img{background:center/contain no-repeat;border:0;border-radius:0;box-shadow:none;align-items:center;align-content:center;padding:0}

.ball.img{background:none;box-shadow:none;border:0}
.ball.img>img{width:100%;height:100%;object-fit:contain}
.molde.img{background:center/contain no-repeat;box-shadow:none;border:0}

.fade{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;pointer-events:none}

<script>
"use strict";
/* =========================================================
   Utilidades
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'style') n.style.cssText = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    n.append(c.nodeType ? c : document.createTextNode(c));
  }
  return n;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rid = (n = 8, abc = 'abcdefghijkmnpqrstuvwxyz23456789') => Array.from({ length: n }, () => abc[Math.floor(Math.random() * abc.length)]).join('');
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

/* sonido */
let AC;
function beep(f = 660, d = .12, type = 'sine', v = .14, delay = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const chord = () => { beep(660, .15, 'triangle', .12); beep(830, .15, 'triangle', .12, .1); beep(990, .25, 'triangle', .12, .2); };
function floaty(node, txt) {
  const r = node.getBoundingClientRect();
  const f = h('div', { class: 'float', style: `left:${r.left + r.width / 2 - 15}px;top:${r.top}px` }, txt);
  document.body.append(f); setTimeout(() => f.remove(), 1000);
}
function confetti() {
  const set = ['#e23d3d', '#f4b400', '#2f9e55', '#c8874f', '#fff8ee'];
  for (let i = 0; i < 40; i++) {
    const c = h('div', { class: 'confetti', style: `left:${Math.random() * 100}vw;background:${pick(set)};animation-duration:${2 + Math.random() * 2.5}s;animation-delay:${Math.random() * 1.5}s` });
    document.body.append(c); setTimeout(() => c.remove(), 6500);
  }
}

/* =========================================================
   Red: MQTT público (gratis, sin cuentas). Los móviles dicen
   qué paso terminaron; la tele dice en qué paso está la clase.
   ========================================================= */
/* bandera de Polonia (el emoji de bandera no funciona en Windows) */
const flag = () => h('span', { class: 'flag', 'aria-label': 'Polonia' });

const NET = {
  /* dos servidores públicos a la vez: si uno falla, funciona el otro */
  brokers: ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'],
  cl: [], seen: new Set(), base: '', onState: null,
  start(room, subs, will, onMsg, onConnect) {
    this.stop();
    this.base = 'szarlotka-clase/' + room + '/';
    if (!window.mqtt) return false;
    this.cl = this.brokers.map(url => {
      const c = mqtt.connect(url, {
        clientId: 'sz' + rid(12), clean: true, keepalive: 30, connectTimeout: 8000, reconnectPeriod: 4000,
        will: will ? { topic: this.base + 'up', payload: JSON.stringify(will), qos: 0, retain: false } : undefined,
      });
      c.on('connect', () => {
        c.subscribe(subs.map(x => this.base + x), { qos: 1 });
        onConnect && onConnect(); this.onState && this.onState();
      });
      c.on('close', () => this.onState && this.onState());
      c.on('error', () => {});
      c.on('message', (topic, buf) => {
        let m;
        try { m = JSON.parse(buf.toString()); } catch (e) { return; }
        if (!m || typeof m !== 'object') return;
        if (m.mid) { if (this.seen.has(m.mid)) return; this.seen.add(m.mid); }
        onMsg(topic.slice(this.base.length), m);
      });
      return c;
    });
    return true;
  },
  pub(sub, obj, retain) {
    const p = JSON.stringify({ ...obj, mid: rid(10) });
    for (const c of this.cl) if (c.connected) c.publish(this.base + sub, p, { qos: 1, retain: !!retain });
  },
  online() { return this.cl.some(c => c.connected); },
  stop() { for (const c of this.cl) c.end(true); this.cl = []; },
};

/* =========================================================

const PLACES = {

  cajon:    { img: 'cajon',   front: 'cajones', de: 'del cajón',             items: ['cuchillo', 'pelador', 'cuchara'] },
  armario3: { img: 'armario', front: 'armarioAbajo2', de: 'del armario de abajo',  items: ['tabla', 'bol', 'sarten', 'molde', 'rallador', 'colador'] },
};
const TOOLS = {

};
const NAMES = { ...NAME, bola: 'la bola pequeña' };
for (const [k, v] of Object.entries({ ...TOOLS, ...DECO })) NAMES[k] = v.n;

/* get: lo que hay que sacar de los muebles antes de la acción */
const STEPS = [
  { k: 'peel',   get: ['tabla', 'manzanas', 'pelador'], t: 'Se pelan las manzanas.', tip: '🔄 Da vueltas con el dedo alrededor de la manzana.' },
  { k: 'cut',    get: ['cuchillo'], t: 'Se cortan las manzanas en trozos.', tip: '🔪 Corta por las líneas de puntos.' },
  { k: 'fry',    get: ['sarten', 'cuchara'], t: 'Se fríen las manzanas 15 minutos.', tip: '✋ Arrastra la tabla a la sartén.' },
  { k: 'add',    get: ['vainilla', 'canela'], t: 'Se añaden el azúcar de vainilla y la canela.', tip: '✋ Arrastra el azúcar y la canela a la sartén.' },
  { k: 'dough',  get: ['bol', 'harina', 'fecula', 'azucarGlas', 'huevo', 'mantequilla', 'levadura'], t: 'Se mezclan la harina, la fécula, el azúcar glas, la yema de huevo, la mantequilla y la levadura.', tip: '✋ Arrastra los ingredientes al bol.' },
  { k: 'divide', get: ['cuchillo'], t: 'Se hacen dos bolas de masa: una grande y una pequeña.', tip: '🔪 Corta por la línea de puntos.' },
  { k: 'fridge', t: 'Se pone la bola pequeña en la nevera.', tip: '✋ Arrastra la bola pequeña a la nevera.' },
  { k: 'mold',   get: ['molde'], t: 'Se pone la bola grande en el molde.', tip: '✋ Arrastra la bola al molde.' },
  { k: 'oven1',  t: 'Se hornea la base 15 minutos a 180 grados.', tip: '✋ Arrastra el molde al horno.' },
  { k: 'apples', t: 'Se ponen las manzanas sobre la base.', tip: '✋ Arrastra la sartén al molde.' },
  { k: 'grate',  get: ['bola', 'rallador'], t: 'Se ralla la bola pequeña sobre las manzanas.', tip: '↕️ Mueve la bola arriba y abajo en el rallador.' },
  { k: 'oven2',  t: 'Se hornea la szarlotka 45 minutos a 175 grados.', tip: '✋ Arrastra el molde al horno.' },
  { k: 'sugar',  show: true, get: ['azucarGlas', 'colador'], t: 'Se decora con azúcar glas.', tip: '↔️ Mueve el colador de un lado a otro.' },
  { k: 'cut2',   show: true, get: ['cuchillo'], t: 'Se corta la szarlotka en trozos.', tip: '🔪 Corta por las líneas de puntos.' },
];
const STEP_AT = k => STEPS.findIndex(s => s.k === k);
const NEEDED = new Set(STEPS.flatMap(s => s.get || []));
/* qué hay en cada mueble al empezar el paso i: lo que ya no se necesita, desaparece */
function placesFor(i) {
  const later = new Set(STEPS.slice(i).flatMap(s => s.get || []));
  const out = {};
  for (const [k, v] of Object.entries(PLACES)) out[k] = v.items.map(it => !NEEDED.has(it) || later.has(it) ? it : null);
  if (i > STEP_AT('fridge') && i <= STEP_AT('grate')) out.nevera.push('bola');
  return out;
}
/* cómo está la tarta al empezar el paso i */
function cakeFor(i) {
  const past = k => i > STEP_AT(k);
  return { base: past('mold'), baked1: past('oven1'), apples: past('apples'), crumb: past('grate'),
           baked2: past('oven2'), sugar: past('sugar'), cuts: past('cut2') ? 4 : 0 };
}
const GOOD = ['¡Muy bien!', '¡Perfecto!', '¡Genial!', '¡Qué bien!', '¡Excelente!', '¡Bravo!'];
const BAD = ['¡Uy, no!', 'No, eso no. 🙂', 'Lee otra vez.', '¡Casi! Otra vez.'];

/* =========================================================
   Arrastrar y soltar (ratón y dedo). Si solo se toca, el
   objeto se selecciona y luego se toca el destino.
   ========================================================= */
let SEL = null;
function select(node) {
  if (SEL) SEL.classList.remove('selected');
  SEL = node === SEL ? null : node;
  if (SEL) SEL.classList.add('selected');
}
function drag(node, onDrop) {
  node._drop = onDrop;
  node.style.touchAction = 'none';
  node.addEventListener('pointerdown', e => {
    if (node.classList.contains('used')) return;
    e.preventDefault();
    const r = node.getBoundingClientRect(), sx = e.clientX, sy = e.clientY;
    let ghost = null, hot = null;
    const findDrop = (x, y) => [...document.querySelectorAll('.drop')].find(d => {
      if (d === node || node.contains(d)) return false;
      const b = d.getBoundingClientRect();
      return x > b.left - 20 && x < b.right + 20 && y > b.top - 20 && y < b.bottom + 20;
    });
    const move = ev => {
      if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
        ghost = node.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('selected');
        Object.assign(ghost.style, { width: r.width + 'px', height: r.height + 'px' });
        document.body.append(ghost); node.classList.add('dragging');
        if (SEL) select(SEL);
      }
      if (!ghost) return;
      ghost.style.left = (ev.clientX - (sx - r.left)) + 'px';
      ghost.style.top = (ev.clientY - (sy - r.top)) + 'px';
      const d = findDrop(ev.clientX, ev.clientY);
      if (d !== hot) { hot && hot.classList.remove('hot'); hot = d; hot && hot.classList.add('hot'); }
    };
    const up = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      hot && hot.classList.remove('hot');
      if (!ghost) { select(node); return; }
      ghost.remove(); node.classList.remove('dragging');
      const d = findDrop(ev.clientX, ev.clientY);
      if (d) onDrop(d, ev.clientX, ev.clientY);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
}
document.addEventListener('click', e => {
  if (!SEL) return;
  const d = e.target.closest('.drop');
  if (!d || d === SEL) return;
  const n = SEL; select(n);
  n._drop && n._drop(d);
});

/* =========================================================
   Gestos de los minijuegos, como en los juegos de cocina:
   cortar por la línea de puntos, dar vueltas y mover de un
   lado a otro. Siempre hay un plan B: tocar también vale.
   ========================================================= */
const SVG = 'http://www.w3.org/2000/svg';
const svgEl = (tag, at) => { const e = document.createElementNS(SVG, tag); for (const k in at) e.setAttribute(k, at[k]); return e; };
const pct = (el, e) => { const r = el.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 100, y: (e.clientY - r.top) / r.height * 100 }; };
/* herramienta que sigue al dedo (cuchillo, pelador, cuchara, colador…) */
function follower(el, tool, keep) {
  const f = h('div', { class: 'tool-follow', hidden: !keep }, tool ? thing(tool) : null);
  el.append(f);
  const t = { el: f, p: { x: 50, y: 50 },
    at(p) { t.p = p; f.hidden = false; f.style.left = p.x + '%'; f.style.top = p.y + '%'; },
    hide() { if (!keep) f.hidden = true; } };
  if (keep) t.at(t.p);
  return t;
}
/* cortar: pasar el cuchillo a lo largo de cada línea de puntos; tocar la línea también corta */
function cutLines(el, lines, { tool = 'cuchillo', onCut, done }) {
  el.classList.add('mg');
  const svg = svgEl('svg', { class: 'guides', viewBox: '0 0 100 100', preserveAspectRatio: 'none' });
  const L = lines.map(([x1, y1, x2, y2]) => {
    const g = svgEl('line', { x1, y1, x2, y2, class: 'guide' }); svg.append(g);
    return { a: { x: x1, y: y1 }, b: { x: x2, y: y2 }, g, cov: new Set(), cut: false };
  });
  const hand = h('div', { class: 'hand' }, h('i', { class: 'tap' }));
  el.append(svg, hand);
  const tl = follower(el, tool);
  const showHand = () => {
    const l = L.find(x => !x.cut);
    if (l) for (const [k, v] of [['--x1', l.a.x], ['--y1', l.a.y], ['--x2', l.b.x], ['--y2', l.b.y]]) hand.style.setProperty(k, v + '%');
  };
  showHand();
  const near = (p, l) => {
    const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y, t = ((p.x - l.a.x) * dx + (p.y - l.a.y) * dy) / (dx * dx + dy * dy);
    if (t < -.05 || t > 1.05) return null;
    return Math.hypot(p.x - l.a.x - t * dx, p.y - l.a.y - t * dy) < 9 ? Math.max(0, Math.min(.999, t)) : null;
  };
  const cutOne = l => {
    if (l.cut) return;
    l.cut = true; l.g.classList.add('done');
    chop(tl.el); beep(520 + 60 * L.filter(x => x.cut).length, .07, 'triangle', .1);
    const n = L.filter(x => x.cut).length;
    onCut && onCut(n);
    if (n === L.length) { svg.remove(); hand.remove(); tl.el.remove(); done(); } else showHand();
  };
  let last = null, start = null;
  el.addEventListener('pointerdown', e => {
    last = start = pct(el, e); el.classList.add('started'); tl.at(last);
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });
  el.addEventListener('pointermove', e => {
    if (!last) return;
    const p = pct(el, e); tl.at(p);
    for (const l of L) {
      if (l.cut) continue;
      const t = near(p, l);
      if (t != null) { l.cov.add(Math.floor(t * 10)); if (l.cov.size >= 7) cutOne(l); }
    }
    last = p;
  });
  ['pointerup', 'pointercancel'].forEach(ev => el.addEventListener(ev, e => {
    if (!last) return;
    const p = pct(el, e);
    if (start && Math.hypot(p.x - start.x, p.y - start.y) < 4) { const l = L.find(x => !x.cut && near(p, x) != null); if (l) cutOne(l); }
    last = start = null; tl.hide();
  }));
}
/* remover / pelar: dar vueltas con el dedo alrededor del centro (cada toque también suma un poco) */
function stir(el, { turns = 3, tool, prog, done }) {
  el.classList.add('mg');
  const ring = h('div', { class: 'ring' }), orbit = h('div', { class: 'orbit' }, h('span', {}, h('i', { class: 'tap' })));
  el.append(ring, orbit);
  const tl = follower(el, tool);
  const need = turns * 2 * Math.PI;
  let acc = 0, lastA = null, down = false, moved = 0, fin = false;
  const ang = e => {
    const r = el.getBoundingClientRect(), dx = e.clientX - r.left - r.width / 2, dy = e.clientY - r.top - r.height / 2;
    return Math.hypot(dx, dy) < Math.min(r.width, r.height) * .08 ? null : Math.atan2(dy, dx);
  };
  const add = d => {
    if (fin) return;
    acc = Math.min(need, acc + d); prog && prog(acc / need);
    if (Math.random() < .12) beep(300 + Math.random() * 200, .04, 'triangle', .05);
    if (acc >= need) { fin = true; ring.remove(); orbit.remove(); tl.el.remove(); done(); }
  };
  el.addEventListener('pointerdown', e => {
    down = true; moved = 0; lastA = ang(e); el.classList.add('started'); tl.at(pct(el, e));
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
  });
  el.addEventListener('pointermove', e => {
    if (!down) return;
    tl.at(pct(el, e));
    const a = ang(e);
    if (a != null && lastA != null) {
      let d = a - lastA;
      if (d > Math.PI) d -= 2 * Math.PI;
      if (d < -Math.PI) d += 2 * Math.PI;
      if (Math.abs(d) < 1.2) { moved += Math.abs(d); add(Math.abs(d)); }
    }
    lastA = a;
  });
  ['pointerup', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => {
    if (down && moved < .2) add(need / 14);
    down = false; tl.hide();
  }));
}
/* espolvorear / rallar: mover de un lado a otro (x) o de arriba abajo (y) */
function shake(el, { axis = 'x', count = 8, tool, follow, prog, done }) {

function runStep() {

  if (G.i >= STEPS.length) finishGame();
  else if (mustWait()) showWait();

/* =========================================================
   La clase: la tele dice en qué paso está todo el grupo.
   Quien termina, espera a los demás.
   ========================================================= */
const PH = { cls: null, ping: null, seq: 0 };
function phoneNet(room) {
  PH.cls = null; PH.ping = null; PH.seq = 0;
  NET.start(room, ['ctl'], { t: 'leave', id: G.id }, (sub, m) => {
    if (sub !== 'ctl' || !G || G.room !== room || typeof m.step !== 'number') return;
    if ((m.seq || 0) < PH.seq) return;
    PH.seq = m.seq || 0;
    /* la clase ya terminó: se juega solo, sin la tele */
    if (PH.cls == null && m.step >= STEPS.length) { G.solo = true; if (G.hold) { G.hold = false; runStep(); } return; }
    PH.cls = m.step;
    if (m.ping !== PH.ping) { PH.ping = m.ping; hello(); }
    if (G.hold && m.play !== false) { G.hold = false; runStep(); }
    classMoved();
  }, hello);
  setTimeout(() => { if (G && G.room === room && !NET.online()) say('📺 ¡Uy! La tele no te ve. Dile al profesor.'); }, 9000);
}
function hello() {
  if (!G || !G.room || G.demo) return;
  NET.pub('up', G.final ? { ...G.final } : { t: 'hi', id: G.id, name: G.name, step: G.i, total: STEPS.length });
}
const mustWait = () => G.room && !G.demo && !G.solo && PH.cls != null && PH.cls < G.i && NET.online();
/* la clase va más adelante: se salta lo que falta (cada paso saltado cuenta como un error) */
function catchUp() {
  if (PH.cls == null || G.solo) return false;
  const c = Math.min(PH.cls, STEPS.length);
  if (c <= G.i) return false;
  G.skipped += c - G.i;
  G.i = c;
  if (c < STEPS.length) hello();
  return true;
}
function classMoved() {
  if (!G || G.final || !G.step) return;
  if (!G.waiting && G.step.over) return;   /* ya va al paso siguiente */
  if (catchUp() || (G.waiting && PH.cls >= G.i)) {
    clearInterval(OVEN_IV);
    if (G.i >= STEPS.length) finishGame(); else runStep();
  }
}

   Pantalla completa: en el móvil se pide en cada toque hasta conseguirla
   (Android). En iPhone no existe: se explica cómo añadirla a la pantalla de inicio.
   ========================================================= */
const FS_OK = !!document.documentElement.requestFullscreen;
const IOS = /iP(hone|od)/.test(navigator.userAgent);
const isFull = () => !!(document.fullscreenElement || matchMedia('(display-mode:fullscreen),(display-mode:standalone)').matches || navigator.standalone);
function goFull() {
  if (!FS_OK || document.fullscreenElement) return;
  document.documentElement.requestFullscreen({ navigationUI: 'hide' })
    .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}))
    .catch(() => {});
}
const markFull = () => document.body.classList.toggle('full', isFull());
document.addEventListener('fullscreenchange', markFull);
/* el móvil vuelve a pantalla completa con el siguiente toque */
addEventListener('pointerup', () => { if (MODE === 'game' && G && !G.demo && matchMedia('(pointer:coarse)').matches) goFull(); }, true);
/* música de fondo: empieza con el primer toque (los navegadores no dejan antes) */
const MUSIC = new Audio('audio/musica.mp3');
MUSIC.loop = true; MUSIC.volume = .3; MUSIC.preload = 'none';
let MUTE = store.get('szarlotka-mute') === true;
const music = on => { if (on && !MUTE) MUSIC.play().catch(() => {}); else MUSIC.pause(); };
/* si el navegador no dejó empezar, empieza con el siguiente toque en el juego */
addEventListener('pointerdown', () => { if (MODE === 'game' && !MUTE && MUSIC.paused) music(true); }, true);
const muteIcon = () => IMG.sonidoOn ? h('img', { src: MUTE ? IMG.sonidoOff : IMG.sonidoOn, alt: '', draggable: 'false' }) : (MUTE ? '🔇' : '🔊');
function muteButton() {
  const b = h('button', { class: 'btn small light mute-btn', 'aria-label': 'Música' }, muteIcon());
  b.onclick = () => { MUTE = !MUTE; store.set('szarlotka-mute', MUTE); b.replaceChildren(muteIcon()); music(true); };
  return b;
}
const fsButton = () => FS_OK ? h('button', { class: 'btn small light fs-btn', onclick: goFull }, '⛶') : null;

/* toda la clase está en la misma sala: no hay códigos */
const ROOM = 'SZARLOTKA';
const TV = { room: null, since: 0, students: {}, idx: 0, live: false, cls: 0, play: false, ping: '', timer: null };
function tvRoom(fresh) {
  let r = !fresh && store.get('szarlotka-room');
  if (!r || Date.now() / 1000 - r.ts > 10 * 3600) r = { ts: Math.floor(Date.now() / 1000) };
  TV.room = ROOM; TV.since = r.ts; TV.students = {};
  /* una clase que ya terminó empieza otra vez desde el paso 1 */
  TV.cls = r.cls > 0 && r.cls < STEPS.length ? r.cls : 0;
  TV.play = !!r.play && r.cls < STEPS.length;
  tvSave();
  NET.onState = () => { TV.live = NET.online(); refreshTV(); };
  NET.start(TV.room, ['up', 'pilot'], null, (sub, m) => {
    if (sub === 'up') onTVMsg(m);
    if (sub === 'pilot') onPilot(m);
  }, () => { tvCtl(true); tvState(); });
}
const tvSave = () => store.set('szarlotka-room', { ts: TV.since, cls: TV.cls, play: TV.play });
/* el paso de la clase se guarda en el servidor (retain) para quien entra tarde */
function tvCtl(newPing) {
  if (newPing) TV.ping = rid(6);
  NET.pub('ctl', { step: TV.cls, play: TV.play, ping: TV.ping, seq: Date.now() }, true);
}
function tvNext() {
  clearTimeout(TV.timer);
  if (TV.cls >= STEPS.length) return;
  TV.cls++; tvSave(); tvCtl(false); beep(990, .12); refreshTV(); tvCheck();
}
const activeStudents = () => Object.values(TV.students).filter(s => !s.away);
/* todos han terminado el paso: la clase sigue sola */
function tvCheck() {
  clearTimeout(TV.timer);
  const act = activeStudents();
  if (TV.cls < STEPS.length && act.length && act.every(s => s.step > TV.cls)) TV.timer = setTimeout(tvNext, 1800);
}
/* el móvil del profesor (pilot) cambia diapositivas y salta pasos */
function onPilot(m) {
  if (m.t === 'go') {
    if (MODE === 'game' && G && G.demo) { clearTimeout(G.idle); clearInterval(OVEN_IV); G = null; startTV(); }
    if (MODE === 'tv') go(m.d > 0 ? 1 : -1);
  }
  if (m.t === 'next') tvNext();
  tvState();
}
/* estado de la tele para el pilot (retain: lo recibe nada más entrar) */
let TV_ST = null;
function tvState() {
  clearTimeout(TV_ST);
  TV_ST = setTimeout(() => {
    const act = activeStudents();
    NET.pub('tv', {
      idx: TV.idx, slides: SLIDES.length, cls: TV.cls, play: TV.play, n: act.length, fin: act.filter(s => s.step > TV.cls).length,
      list: ranked().slice(0, 40).map(s => ({ n: s.name, s: s.done ? 'done' : s.away ? 'away' : s.step > TV.cls ? 'ok' : 'cook' })),
      seq: Date.now(),
    }, true);
  }, 300);
}
function onTVMsg(m) {
  if (!m || typeof m.id !== 'string') return;
  if (m.t === 'leave') {
    if (TV.students[m.id]) { TV.students[m.id].away = true; refreshTV(); tvCheck(); }
    return;
  }
  const s = TV.students[m.id] || (TV.students[m.id] = { id: m.id, step: 0 });
  s.away = false;
  s.name = String(m.name || '?').slice(0, 18);
  s.total = +m.total || STEPS.length;
  if (typeof m.step === 'number') s.step = Math.max(s.step, Math.min(m.step, s.total));
  if (m.t === 'done') { s.done = true; s.score = +m.score || 0; s.mistakes = +m.mistakes || 0; s.secs = +m.secs || 0; }
  refreshTV(); tvCheck();
}
function ranked() {
  return Object.values(TV.students).sort((a, b) =>
    (b.done ? 1 : 0) - (a.done ? 1 : 0) || (b.score || 0) - (a.score || 0) || b.step - a.step || a.name.localeCompare(b.name));
}

/* =========================================================
   Pilot: el móvil de quien presenta (…/?pilot o …/pilot)
   ========================================================= */
function showPilot() {
  const code = ROOM;
  MODE = 'pilot';
  let st = null;
  const send = m => NET.pub('pilot', m);
  const live = h('span', {}, '🟡'), num = h('span', { class: 'p-num' }, '… / ' + SLIDES.length);
  const es = h('p', { class: 'p-es' }, 'Conectando con la tele…'), pl = h('p', { class: 'p-pl' });
  const game = h('div', { class: 'p-game', hidden: true });
  restart(h('div', { class: 'pilot' },
    h('div', { class: 'p-top' }, h('b', {}, 'Mando'), num, live),
    h('div', { class: 'p-notes' }, es, pl),
    game,
    h('div', { class: 'p-nav' },
      h('button', { class: 'btn light', 'aria-label': 'Anterior', onclick: () => send({ t: 'go', d: -1 }) }, '◀'),
      h('button', { class: 'btn', 'aria-label': 'Siguiente', onclick: () => send({ t: 'go', d: 1 }) }, '▶'))));
  const draw = () => {
    const N = STEPS.length;
    const n = st.idx === LOBBY && st.play ? NARR[Math.min(st.cls, N)] : NOTES[st.idx] || { es: '', pl: '' };
    num.textContent = (st.idx + 1) + ' / ' + st.slides;
    es.textContent = n.es; pl.textContent = n.pl;
    game.hidden = st.idx !== LOBBY;
    game.innerHTML = '';
    if (game.hidden) return;
    game.append(
      h('div', { class: 'p-step' }, st.cls < N ? h('b', {}, 'Paso ' + (st.cls + 1) + ' de ' + N + ': ') : null,
        st.cls < N ? STEPS[st.cls].t : '🎉 ¡Todos han terminado!'),
      h('div', { class: 'p-row' }, h('span', {}, '✅ ' + st.fin + ' / ' + st.n + ' listos'),
        st.cls < N ? h('button', { class: 'btn green small', onclick: () => send({ t: 'next' }) }, '⏭ Siguiente paso') : null),
      h('div', { class: 'p-list' }, (st.list || []).map(x =>
        h('span', { class: 'p-stu ' + x.s }, ({ done: '🏁', away: '💤', ok: '✅', cook: '🍳' })[x.s] + ' ' + x.n))));
  };
  NET.onState = () => { live.textContent = NET.online() ? '🟢' : '🟡'; };
  NET.start(code, ['tv'], null, (sub, m) => {
    if (sub !== 'tv' || typeof m.idx !== 'number' || (st && (m.seq || 0) < (st.seq || 0))) return;
    st = m; draw();
  }, () => send({ t: 'hi' }));
  setTimeout(() => { if (MODE === 'pilot' && !st) es.textContent = '📺 La tele no contesta. ¿Está abierta la presentación?'; }, 9000);
}

function startTV(at) {
  MODE = 'tv';
  music(false);
  if (!TV.room) tvRoom(false);
  if (typeof at === 'number') TV.idx = at;
  if (TV.idx >= LOBBY && !TV.play) { TV.play = true; tvSave(); }
  renderTV();
}
function renderTV() {
  if (MODE !== 'tv') return;
  const nav = h('div', { class: 'tvnav' },
    h('button', { class: 'btn small light', onclick: () => go(-1) }, '◀'),
    h('span', { class: 'cnt', id: 'tvconn' }, h('i', { class: 'dot' }), 'conectando…'),
    h('span', { class: 'cnt' }, (TV.idx + 1) + ' / ' + SLIDES.length),
    h('button', { class: 'btn small light', onclick: () => go(1) }, '▶'),
    h('button', { class: 'btn small light', title: 'Pantalla completa', onclick: () => { const d = document; d.fullscreenElement ? d.exitFullscreen() : d.documentElement.requestFullscreen && d.documentElement.requestFullscreen().catch(() => {}); } }, '⛶'));
  restart(SLIDES[TV.idx](), nav);
  const qr = $('#qr');
  if (qr && window.QRCode) new QRCode(qr, { text: joinURL(), width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
  refreshTV();
}
function go(d) {
  TV.idx = Math.max(0, Math.min(SLIDES.length - 1, TV.idx + d));
  /* en la diapositiva del juego los móviles empiezan a cocinar */
  if (TV.idx >= LOBBY && !TV.play) { TV.play = true; tvSave(); tvCtl(false); }
  renderTV();
}
function refreshTV() {
  if (TV.room) tvState();
  if (MODE !== 'tv') return;
  const cn = $('#tvconn');

  const list = ranked();
  const joined = $('#joined');

    joined.innerHTML = '';
    const act = list.filter(s => !s.away);

      ...act.slice(0, 30).map(s => h('span', { class: 'chip2' }, s.name)));
  }
  const board = $('#board');
  if (board) {
    board.innerHTML = '';
    const done = list.filter(s => s.done).length;
    board.append(h('div', { class: 'board-head' },
      h('span', {}, list.length ? list.length + (list.length === 1 ? ' cocinero' : ' cocineros') + (done ? ' · ' + done + ' terminados' : '') : 'Todavía nadie'),
      h('span', { class: 'conn' }, h('i', { class: 'dot' + (TV.live ? ' on' : '') }), TV.live ? 'en directo' : 'conectando…')));
    const N = STEPS.length;
    board.append(TV.cls < N
      ? h('div', { class: 'cls' },
          h('div', { class: 'cls-t' }, h('b', {}, 'Paso ' + (TV.cls + 1) + ' de ' + N + ': '), STEPS[TV.cls].t))
      : h('div', { class: 'cls' }, h('div', { class: 'cls-t' }, h('b', {}, '¡Todos han terminado!'))));
    const bl = h('div', { class: 'board-list' });
    if (!list.length) bl.append(h('div', { class: 'empty' }, 'Todavía no hay nadie en la clase.'));
    list.slice(0, 14).forEach((s, i) => bl.append(h('div', { class: 'stu' + (s.done ? ' fin' : '') },
      s.done ? h('span', {}, String(i + 1) + '.') : h('i', { class: 'dot st-' + (s.away ? 'away' : s.step > TV.cls ? 'ok' : 'cook') }),
      h('span', { class: 'n' }, s.name),
      h('div', { class: 'pb' }, h('i', { style: 'width:' + Math.round(100 * s.step / s.total) + '%' })),
      h('span', { class: 's' }, s.done ? s.score + ' pts' : 'paso ' + Math.min(s.step + 1, s.total)))));
    if (list.length > 14) bl.append(h('div', { class: 'conn' }, '+ ' + (list.length - 14) + ' más'));
    board.append(bl);
  }
  const pod = $('#podium');
  if (pod) {
    pod.innerHTML = '';
    const fin = list.filter(s => s.done);
    if (!fin.length) { pod.append(h('div', { class: 'empty' }, 'Todavía nadie ha terminado…')); return; }
    const p = (s, cls, medal) => s ? h('div', { class: 'pod ' + cls },
      h('div', { class: 'who' }, s.name), h('div', { class: 'pts' }, s.score + ' pts · ' + s.mistakes + (s.mistakes === 1 ? ' error' : ' errores')),
      h('div', { class: 'blk' }, medal)) : h('div', { class: 'pod ' + cls });
    pod.append(h('div', { class: 'podium' }, p(fin[1], 'p2', '2'), p(fin[0], 'p1', '1'), p(fin[2], 'p3', '3')));
    const rest = fin.slice(3);
    if (rest.length) pod.append(h('div', { class: 'rest', style: 'margin:3vh auto 0' },
      rest.map((s, i) => h('span', {}, (i + 4) + '. ' + s.name + ' · ' + s.score))));
  }
}
let TV_FS = false;
const tvFull = () => { if (MODE === 'tv' && !TV_FS) { TV_FS = true; goFull(); } };
addEventListener('pointerup', tvFull);
document.addEventListener('keydown', e => {
  if (MODE !== 'tv') return;
  tvFull();
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(1); }
  if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(-1); }
});

/* =========================================================
   Inicio
   ========================================================= */
const params = new URLSearchParams(location.search);
markFull();
loadImages().then(() => {
  if (params.has('pilot')) showPilot();
  else if (params.has('jugar') || params.has('sala')) showJoin(); else if (params.has('tv')) startTV(Math.max(0, (+params.get('tv') || 1) - 1)); else showHome();
});
